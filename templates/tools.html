{% extends 'base.html' %}

{% block content %}
  <ul>
    {% for tool in config.tools %}
      <li>
          <a href="{% if tool.url %}{{ tool.url }}{% else %}{{ tool.path }}{% endif %}">{{ tool.name }}</a>{% if tool.description %}:
        {{ tool.description }}
        {% endif %}
      </li>
    {% endfor %}
  </ul>
{% endblock %}
